<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RARA POS — Fragrance / Fashions</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">
<!-- Live video background (v1.1.1): plays behind the whole app in the Dark
     theme. Paused + hidden in the Light theme and when Settings > Live
     Background is OFF (see App.applyLiveBackground). -->
<video id="bg-video" src="assets/background.mp4" muted loop autoplay playsinline preload="auto" aria-hidden="true" tabindex="-1"></video>
<div id="bg-overlay" aria-hidden="true"></div>
<div id="notice-stack" aria-live="polite"></div>

<!-- Login overlay: shown when no user is logged in -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <img id="login-logo-img" src="assets/rara-logo-dark.png" alt="RARA" onerror="this.style.display='none'">
      <div class="login-brand">RARA</div>
      <div class="login-sub">Fragrance / Fashions</div>
    </div>
    <div id="login-body"></div>
  </div>
</div>

<!-- Confirm dialog -->
<div id="confirm-overlay" class="confirm-overlay" hidden>
  <div class="confirm-box">
    <h3 id="confirm-title"></h3>
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button id="confirm-no" class="btn btn-ghost">Cancel</button>
      <button id="confirm-yes" class="btn btn-danger">Confirm Karein</button>
    </div>
  </div>
</div>

<!-- Bill preview modal (v1.1.2): the bill is shown first, then printed.
     The white 72mm card renders the same receiptHtml as printing, so the
     preview is exactly what prints. -->
<div id="bill-preview-overlay" class="bill-preview-overlay" hidden>
  <div class="bill-preview-card">
    <div class="bill-preview-head">
      <h3>Bill Preview</h3>
      <button id="bill-preview-x" class="btn btn-ghost" type="button" aria-label="Band Karein">×</button>
    </div>
    <div id="bill-preview-body" class="bill-preview-body"></div>
    <div class="bill-preview-actions">
      <button id="bill-preview-print" class="btn btn-primary" type="button">Print Karein</button>
      <button id="bill-preview-close" class="btn" type="button">Band Karein</button>
    </div>
  </div>
</div>

<div id="app-shell" class="app-shell" hidden>
  <header class="app-header">
    <div class="header-brand">
      <img id="header-logo-img" src="assets/rara-logo-dark.png" alt="RARA logo" onerror="this.style.display='none'">
      <span id="header-logo-text" class="header-logo-text">RARA</span>
      <span class="header-titles">
        <span class="header-name">RARA</span>
        <span class="header-sub">Fragrance / Fashions</span>
      </span>
    </div>
    <div class="header-right">
      <select id="branch-select" class="input branch-select" title="Branch"></select>
      <span id="net-badge" class="badge badge-offline">Offline — Local</span>
      <button id="theme-toggle" class="btn btn-ghost" type="button" title="Dark / Light theme">Light Mode</button>
      <span id="user-chip" class="user-chip"></span>
      <button id="logout-btn" class="btn btn-ghost" type="button">Lock / Logout</button>
    </div>
  </header>

  <div class="app-body">
    <nav id="sidebar" class="sidebar" aria-label="Main navigation"></nav>
    <main id="screen" class="screen"></main>
  </div>
</div>

<!-- Hidden 72mm thermal receipt print area -->
<div id="receipt-print" class="receipt-print"></div>

<script src="src/ui.js"></script>
<script src="src/pos.js"></script>
<script src="src/products.js"></script>
<script src="src/stock.js"></script>
<script src="src/dashboard.js"></script>
<script src="src/management.js"></script>
<script src="src/reports.js"></script>
<script src="src/settings.js"></script>
<script>
  // Renderer entry point. Other screen modules (dashboard / management /
  // reports / settings) register into window.Screens; App.go() falls back
  // gracefully if one has not loaded yet.
  window.App.init();
</script>
</body>
</html>
