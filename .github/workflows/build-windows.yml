# Build the RARA POS Windows installer
# NOTE: the installer cannot be built on Linux. electron-builder needs
# Windows (or Wine) to produce an NSIS .exe, so this workflow MUST run
# on windows-latest. Do not move it to ubuntu-latest.

name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (NSIS)
        run: npx electron-builder --win nsis --publish=never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: rara-pos-windows-installer
          path: dist/*.exe
