# Build the RARA POS Windows installer + publish a GitHub Release.
# NOTE: the installer cannot be built on Linux. electron-builder needs
# Windows (or Wine) to produce an NSIS .exe, so this workflow MUST run
# on windows-latest. Do not move it to ubuntu-latest.
#
# The build PUBLISHES a real GitHub Release (installer .exe + latest.yml)
# so installed apps can update themselves in-app (electron-updater).
# GH_TOKEN is the built-in Actions token (contents: write) — no personal
# token is needed here. The artifact upload is kept as well, so the .exe
# can also be downloaded directly from the run page.

name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (NSIS) and publish Release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: rara-pos-windows-installer
          path: dist/*.exe
